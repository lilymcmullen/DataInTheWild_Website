format:
  html:
    theme:
      - styles.scss
    mainfont: "Raleway"
    toc: true
    page-layout: full
    include-in-header:
      text: |
        <script>
          (function () {
            // GitHub Pages serves this project under /DataInTheWild_Website/.
            // Local `quarto preview` (and a custom domain) serve it from the root.
            // Detect which, so the scripts load from the right place in either case.
            var repo = "/DataInTheWild_Website";
            var base = window.location.pathname.indexOf(repo + "/") === 0 ? repo : "";
            ["toggle-view", "course-data", "downloads-list"].forEach(function (name) {
              var s = document.createElement("script");
              s.src = base + "/scripts/" + name + ".js";
              document.head.appendChild(s);
            });
          })();
        </script>

editor: visual